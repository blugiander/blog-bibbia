name: Deploy Matrix 4.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessario per mkdocs git-revision-date

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MkDocs and Plugins
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-minify-plugin

      - name: Matrix Auto-Optimization (Phase 1)
        run: python scripts/optimize_markdown.py

      - name: Matrix Asset Generation (Phase 2)
        run: python scripts/generate_matrix_assets.py

      - name: Commit Auto-Generated Content
        run: |
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: auto-optimization [skip ci]"
          git push origin main || echo "No changes to push"

      - name: Build and Deploy MkDocs
        run: mkdocs gh-deploy --force
