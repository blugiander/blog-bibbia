name: Deploy Matrix 3.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs and Plugins
        run: |
          pip install mkdocs-material 
          pip install mkdocs-minify-plugin

      - name: Matrix 3.0 Auto-Optimization (Phase 1)
        run: python scripts/optimize_markdown.py

      - name: Matrix 3.0 SVG Generation (Phase 2)
        run: python scripts/generate_matrix_assets.py

      - name: Commit Auto-Generated Content (Phase 6)
        run: |
          git add docs/
          git commit -m "Auto-optimization: Markdown formatting, SEO and SVG assets" || echo "No changes to commit"
          git push origin main || echo "No changes to push"

      - name: Build and Deploy MkDocs (Phase 4)
        run: mkdocs gh-deploy --force
